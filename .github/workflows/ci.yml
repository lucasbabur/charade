name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types, tests, mlcheck, OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # docs freshness test compares updated-at with git history
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        timeout-minutes: 8
        run: uv sync --all-packages --locked --extra train --extra cpu
      - name: Lint and format
        run: uv run poe lint
      - name: Types
        run: uv run poe types
      - name: Import layers (no cycles)
        run: uv run poe imports
      - name: Tests (charade)
        run: uv run poe test
      - name: Tests (mlcheck)
        run: uv run poe test-mlcheck
      - name: Experiment notebooks execute (smoke mode)
        run: uv run poe test-notebooks
        env:
          MPLBACKEND: Agg
      - name: ML static gates
        run: uv run poe mlcheck
      - name: OpenAPI contract is current
        run: |
          uv run poe openapi
          git diff --exit-code -- docs/api/openapi.json

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Validate
        run: uv run --no-project --with poethepoet poe tf
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: tflint
        working-directory: infra/terraform
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          compact: true
          skip_path: .terraform
          download_external_modules: false

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: hadolint (api)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/api.Dockerfile
          failure-threshold: warning
      - name: hadolint (train)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/train.Dockerfile
          failure-threshold: warning
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          tags: charade-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8000:8000 charade-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health || { docker logs api; exit 1; }
      - name: Served OpenAPI matches the committed contract
        run: |
          curl -fsS http://127.0.0.1:8000/openapi.json \
            | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin), indent=2, sort_keys=True))" > served.json
          diff -u docs/api/openapi.json served.json
