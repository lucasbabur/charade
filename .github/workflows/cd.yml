name: CD

# Release flow: tag vX.Y.Z -> build and push both images -> terraform plan/apply per environment
# behind GitHub environment approvals. Model bundles are promoted separately by the daily retrain
# job (scripts/retrain.sh) only when mlcheck passes. Disabled until the repository variable
# AWS_DEPLOY_ROLE_ARN (output of infra/terraform `deploy_role_arn`) is set.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/charade-${{ vars.ENVIRONMENT || 'staging' }}-api:${{ steps.tag.outputs.tag }}
      - name: Training image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/train.Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/charade-${{ vars.ENVIRONMENT || 'staging' }}-train:${{ steps.tag.outputs.tag }}

  deploy:
    name: Terraform apply (${{ matrix.environment }})
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        environment: [staging, prod]
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"
      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=charade/${{ matrix.environment }}.tfstate"
          -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
      - name: Plan
        # Keep serving the last promoted bundle: a release changes images, never the model (retraining does).
        run: |
          bucket=$(terraform output -raw artifacts_bucket 2>/dev/null || true)
          bundle=$( [ -n "$bucket" ] && aws s3 cp "s3://$bucket/bundles/CURRENT" - 2>/dev/null | tr -d '[:space:]' || true)
          terraform plan -input=false -out=tfplan \
            -var-file="${{ matrix.environment }}.tfvars" \
            -var="api_image_tag=${{ needs.images.outputs.tag }}" \
            -var="train_image_tag=${{ needs.images.outputs.tag }}" \
            -var="bundle_run_id=$bundle"
      - name: Apply
        run: terraform apply -input=false tfplan
