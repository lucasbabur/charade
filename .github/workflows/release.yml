name: Release

# Continuous delivery stops at a versioned artifact: tag vX.Y.Z -> the API image, built from the
# tagged commit, pushed to GitHub Container Registry as ghcr.io/<owner>/charade-api:X.Y.Z (immutable)
# and :sha-<commit>. Deploying it is out of scope: infra/terraform is a validated sketch, never applied
# (docs/09-operations.md). The model bundle is not baked in; tasks load a pinned bundle at start.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/charade-api
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
