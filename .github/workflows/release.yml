name: Release

# Attach the generated API contract to every version tag, so integrators can pin a schema.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  contract:
    name: Publish OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create release with openapi.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" docs/api/openapi.json --generate-notes --verify-tag
