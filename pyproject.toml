[project]
name = "charade"
version = "0.1.0"
description = "Contextual ad CTR prediction and ranking for AI companion chats."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142",
    "numpy>=2.1",
    "onnxruntime>=1.30",
    "polars>=1.30",
    "prometheus-client>=0.26",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "redis>=8.1",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
# Offline training/analysis stack. Never installed in the serving image (mlcheck MLS001 enforces the import side).
train = [
    "lightgbm>=4.7",
    "matplotlib>=3.11",
    "onnx>=1.23",
    "onnxscript>=0.7",
    "optuna>=4.5",
    "openai>=2.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "sentence-transformers>=6.1",
    "tenacity>=9.1",
    "typer>=0.19",
]
# Pick exactly one torch build: `--extra cpu` (CI) or `--extra gpu` (CUDA 13, local GTX 1660 SUPER).
cpu = ["torch>=2.14"]
gpu = ["torch>=2.14"]

[dependency-groups]
dev = [
    "fakeredis>=2.38",
    "httpx>=0.28",
    "hypothesis>=6.140",
    "import-linter>=2.15",
    "ipykernel>=7.4",
    "jupytext>=1.19",
    "nbclient>=0.11",
    "locust>=2.46",
    "mlcheck",
    "poethepoet>=0.48",
    "pyright>=1.1.405",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["tools/mlcheck"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
mlcheck = { workspace = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.charade]
data_dir = "."
artifacts_dir = "artifacts/current"
seed = 20141021
train_end = "2014-10-27T23:00:00"
val_end = "2014-10-28T23:00:00"
# Serving: Redis read budget. Within the 50 ms p99 envelope, a slow store degrades to cold-user
# defaults instead of failing (docs/08-serving-architecture.md).
store_timeout_ms = 20.0

# Shipped model. Values come from reports/tuning/{dcn,gbdt}.csv (best trial on the inner split,
# train 10-21..26 / select 10-27); see docs/04-models-evaluation.md. `groups` and `text_provider`
# follow reports/models/ablations.csv.
[tool.charade.model]
# character_id and conversation are dropped: their ablation CIs include zero (decision rule in docs/hypotheses.md).
groups = ["context", "device", "ad", "character_meta", "user_history"]

# Ranking policy (docs/05-ranking-policy.md). The data has no advertiser preferences, so the
# brand-safety matrix below is illustrative: advertiser 157 accepts up to suggestive characters,
# advertiser 48 only sfw ones. Every other advertiser accepts all tiers.
[tool.charade.policy]
exploration_rate = 0.05
min_evidence = 20.0
max_evidence = 1000.0
frequency_cap = 8
exploration_sharpness = 2.0
advertiser_max_tier = { "157" = "suggestive", "48" = "sfw" }

[tool.charade.model.dcn]
embedding_dim = 24
cross_layers = 2
cross_rank = 64
hidden = [256, 128]
dropout = 0.3
lr = 0.0029
weight_decay = 1.3e-5
batch_size = 2048
character_id_dropout = 0.08
seeds = [0, 1, 2]

[tool.charade.model.gbdt]
# Best of 60 trials (equal search effort with DCN-v2), reports/tuning/gbdt.csv trial 51.
learning_rate = 0.0144
num_leaves = 254
min_data_in_leaf = 323
cat_smooth = 26.85
cat_l2 = 1.39
feature_fraction = 0.40
lambda_l2 = 8.62

[tool.poe.tasks]
lint = { sequence = [{ shell = "ruff check . && ruff format --check ." }, { shell = "ruff check . && ruff format --check .", cwd = "tools/mlcheck" }], help = "Ruff lint and format check" }
types = { sequence = [{ cmd = "pyright" }, { cmd = "pyright", cwd = "tools/mlcheck" }], help = "Pyright strict" }
test = { cmd = "pytest", help = "Charade tests with coverage gate" }
test-mlcheck = { cmd = "pytest", cwd = "tools/mlcheck", help = "mlcheck's own tests" }
mlcheck = { cmd = "mlcheck . --stage static", help = "ML static gates" }
mlcheck-data = { cmd = "mlcheck . --stage data", help = "Data contract on the raw CSVs (local only; data is not in git)" }
eda = { cmd = "python -m charade.analysis.eda", help = "Write reports/eda/eda.md" }
text = { cmd = "python -m charade.text.bakeoff", help = "Embed character descriptions and write reports/text_bakeoff.csv (OPENAI_API_KEY optional)" }
tune = { cmd = "python -m charade.models.tune", help = "Optuna search on the inner split; writes reports/tuning/" }
train = { cmd = "python -m charade.models.pipeline", help = "Train, calibrate, evaluate once on test, export; writes artifacts and reports/models/metrics.json" }
refit-study = { cmd = "python -m charade.models.refit", help = "Should the model also train on the validation day? Decided one day earlier; writes reports/models/refit_study.json" }
ablate = { cmd = "python -m charade.models.ablate", help = "Feature-group ablations on validation; writes reports/models/ablations.csv" }
ope = { cmd = "python -m charade.analysis.policy_eval", help = "Off-policy evaluation of ranking policies on test; writes ope.json, decisions.jsonl, reports/policy/ope.md" }
parity = { cmd = "python -m charade.analysis.parity", help = "Train/serve feature parity on replayed test requests; writes parity.json" }
loadtest = { shell = "python -m charade.analysis.loadtest && locust -f tests/load/locustfile.py --headless -u ${USERS:-32} -r 32 -t ${DURATION:-90s} --host ${HOST:-http://127.0.0.1:8000} --csv artifacts/loadtest/locust --only-summary --exit-code-on-error 0 && python -m charade.analysis.loadtest summarize artifacts/loadtest/locust_stats.csv ${HOST:-http://127.0.0.1:8000}", help = "Load-test a running API (docker compose up) and write latency.json" }
samples = { cmd = "python -m charade.analysis.samples", help = "Rank two example chat contexts through the API; writes reports/sample_rankings.json" }
coldstart = { cmd = "python -m charade.analysis.coldstart", help = "Cold-start signal, priors and graduation analysis; writes reports/coldstart/" }
drift = { cmd = "python -m charade.analysis.drift", help = "PSI, churn, staleness backtest, online recalibration; writes drift.json and reports/drift/" }
adapt = { cmd = "python -m charade.analysis.adaptation", help = "Cohort-exposure adaptation layer replay; writes reports/drift/adaptation.md" }
fixture = { cmd = "python -m charade.analysis.fixture", help = "Rebuild tests/fixtures from the raw CSVs" }
openapi = { cmd = "python -m charade.serving.openapi", help = "Regenerate docs/api/openapi.json" }
serve = { cmd = "uvicorn charade.serving.app:app --reload", help = "Run the API locally" }
tf = { shell = "terraform fmt -check -recursive infra/terraform && for env in infra/terraform/envs/*/; do terraform -chdir=$env init -backend=false -input=false >/dev/null && terraform -chdir=$env validate || exit 1; done", help = "Terraform fmt and validate" }
experiments = { cmd = "python -m charade.analysis.notebooks", help = "Execute experiment notebooks on the full data (all, or the given notebook.py paths; E004 retrains)" }
test-notebooks = { cmd = "pytest -m notebooks --no-cov", help = "Execute every experiment notebook in smoke mode (fixture data, tiny model)" }
imports = { cmd = "lint-imports", help = "Import-layer contracts (no cycles, serving stays light)" }
check = { sequence = ["lint", "types", "imports", "test", "test-mlcheck", "mlcheck"], help = "Everything CI runs on Python" }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "N", "S", "PL", "PT", "PERF", "RUF", "C90", "D"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "D105", "D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "S311"]
# Notebooks (jupytext percent scripts): a bare expression at the end of a cell is how a notebook displays it.
"experiments/**" = ["D", "B018", "E402", "E501", "INP001", "T201", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests"]
exclude = ["tools", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# torch, lightgbm, sklearn and polars expose partially-unknown types; strict otherwise.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not notebooks' --cov=charade --cov-branch --cov-report=term-missing"
markers = ["notebooks: executes experiment notebooks in smoke mode (slow; `uv run poe test-notebooks`)"]

[tool.coverage.report]
fail_under = 85

# Dependency direction, enforced by import-linter (`uv run poe imports`). Higher layers may import
# lower ones, never the reverse; packages in one layer (separated by |) may not import each other.
# A layers contract also rules out cycles between packages.
[tool.importlinter]
root_package = "charade"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered packages, no cycles"
type = "layers"
containers = ["charade"]
layers = [
    "analysis",
    "serving",
    "models",
    "evaluation",
    "text | ranking | scoring",
    "features",
    "data",
    "config",
]

[[tool.importlinter.contracts]]
name = "Serving never imports training, evaluation or analysis code"
type = "forbidden"
source_modules = ["charade.serving", "charade.scoring", "charade.ranking", "charade.features"]
forbidden_modules = ["charade.models", "charade.evaluation", "charade.analysis", "charade.text", "torch", "lightgbm", "sklearn", "optuna"]

[tool.mlcheck]
package = "charade"
notebooks_allowed_in = ["experiments"]
source_root = "src"
serving_package = "charade.serving"
features_package = "charade.features"
artifacts_dir = "artifacts/current"
primary_model = "dcn_v2"
baseline_model = "logreg"
split_order = ["train", "val", "test"]
holdout_split = "test"
required_slices = ["character_support", "genre", "safety_tier", "surface", "day", "user_seen", "banner_pos"]
bundle_files = ["model.onnx", "feature_spec.json", "calibrator.json", "evidence.json", "characters.parquet"]

[tool.mlcheck.data]
path = "impressions.csv"
id = "id"
label = "click"
time = "hour"
time_format = "%y%m%d%H"
period = "1d"
required_columns = ["banner_pos", "conversation_turn", "session_msg_count"]
categorical = ["site_id", "app_id", "device_id", "device_ip", "device_model", "device_type", "device_conn_type", "C1", "C14", "C17", "C21"]

[[tool.mlcheck.data.foreign_keys]]
column = "character_id"
ref_path = "characters.csv"
ref_column = "character_id"
ref_created_at = "created_at"
ref_time_format = "%Y-%m-%d"
