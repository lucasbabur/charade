<text x="1190" y="439" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">No bias repair.</text>
<text x="1190" y="466" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">No leakage</text>
<text x="1190" y="493" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">prevention.</text>
<text x="1190" y="520" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Cross-hour</text>
<text x="1190" y="547" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">dependence stays.</text>
<text x="50" y="609" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">WITH replacement: hours may repeat or be absent. Both models get the SAME sample.</text>
