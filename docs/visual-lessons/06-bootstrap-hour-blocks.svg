<title id="title">06 · Move whole hours, compare models together</title><desc id="desc">A traffic shock can affect many impressions in an hour; rows are not independent surprises. Resample the same whole hours for both models to preserve a paired comparison. Read the accompanying gallery explanation for a complete text counterpart.</desc>
