<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc" lang="en">
<title id="title">07 · A perfect average can hide bad bins</title><desc id="desc">Two equal-size bins make opposite errors that cancel in the overall mean. Check calibration within bins: an overall predicted/observed ratio of 1.0 can conceal error. Read the accompanying gallery explanation for a complete text counterpart.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker></defs>
<rect width="1440" height="960" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#0b0b0b">
<text x="50" y="90" font-size="40" font-weight="650" fill="#0b0b0b" text-anchor="start">07 · A perfect average can hide bad bins</text>
<text x="50" y="128" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">Two equal-size bins make opposite errors that cancel in the overall mean.</text>
<line x1="50" y1="151" x2="1390" y2="151" stroke="#e1e0d9" stroke-width="1.5"/>
<line x1="50" y1="851" x2="1390" y2="851" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="50" y="879" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">Check calibration within bins: an overall predicted/observed ratio of 1.0 can conceal error.</text>
<text x="50" y="905" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Illustrative example, not measured Charade results.</text>
<text x="50" y="196" font-size="28" font-weight="600" fill="#0b0b0b" text-anchor="start">Two bins · 1,000 rows each</text>
<line x1="780" y1="189" x2="822" y2="189" stroke="#2a78d6" stroke-width="4"/>
<text x="835" y="197" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Predicted</text>
<circle cx="1046" cy="189" r="7" fill="#eb6834"><title>Observed click rate marker</title></circle>
<text x="1065" y="197" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Observed</text>
<line x1="385.0" y1="240" x2="385.0" y2="495" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="385.0" y="535" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="middle">0%</text>
<line x1="616.25" y1="240" x2="616.25" y2="495" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="616.25" y="535" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="middle">10%</text>
<line x1="847.5" y1="240" x2="847.5" y2="495" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="847.5" y="535" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="middle">20%</text>
<line x1="1078.75" y1="240" x2="1078.75" y2="495" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="1078.75" y="535" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="middle">30%</text>
<line x1="1310.0" y1="240" x2="1310.0" y2="495" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="1310.0" y="535" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="middle">40%</text>
<text x="50" y="310" font-size="28" font-weight="600" fill="#0b0b0b" text-anchor="start">Low bin</text>
<text x="50" y="345" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">1,000 rows</text>
<line x1="500.625" y1="310" x2="616.25" y2="310" stroke="#52514e" stroke-width="2"/>
<line x1="616.25" y1="293" x2="616.25" y2="327" stroke="#2a78d6" stroke-width="4"/>
<circle cx="500.625" cy="310" r="8" fill="#eb6834"><title>Low bin: observed 5%</title></circle>
<text x="616.25" y="276" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="middle">Predicted 10%</text>
<text x="500.625" y="358" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="middle">Observed 5%</text>
<text x="50" y="435" font-size="28" font-weight="600" fill="#0b0b0b" text-anchor="start">High bin</text>
<text x="50" y="470" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">1,000 rows</text>
<line x1="1078.75" y1="435" x2="1194.375" y2="435" stroke="#52514e" stroke-width="2"/>
<line x1="1078.75" y1="418" x2="1078.75" y2="452" stroke="#2a78d6" stroke-width="4"/>
<circle cx="1194.375" cy="435" r="8" fill="#eb6834"><title>High bin: observed 35%</title></circle>
<text x="1078.75" y="401" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="middle">Predicted 30%</text>
<text x="1194.375" y="483" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="middle">Observed 35%</text>
<rect x="50" y="576" width="638" height="177" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"><title>Average looks perfect</title></rect>
<line x1="51" y1="594" x2="51" y2="735" stroke="#2a78d6" stroke-width="4"/>
<text x="70" y="614" font-size="28" font-weight="600" fill="#0b0b0b" text-anchor="start">Average looks perfect</text>
<text x="70" y="652" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Predicted: 100 + 300 = 400 clicks</text>
<text x="70" y="683" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Observed: 50 + 350 = 400 clicks</text>
<text x="70" y="714" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Both means = 20%; ratio = 1.0</text>
<rect x="752" y="576" width="638" height="177" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"><title>Bin errors remain</title></rect>
<line x1="753" y1="594" x2="753" y2="735" stroke="#eb6834" stroke-width="4"/>
<text x="772" y="614" font-size="28" font-weight="600" fill="#0b0b0b" text-anchor="start">Bin errors remain</text>
<text x="772" y="652" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">ECE = .5 × |.10 − .05| + .5 × |.30 − .35|</text>
<text x="772" y="683" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">= .05 = 5 percentage points</text>
<text x="772" y="714" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Absolute errors cannot cancel.</text>
<text x="50" y="797" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Equal-mass bins have similar row counts, not equal probability widths.</text>
<text x="50" y="829" font-size="22" font-weight="400" fill="#0b0b0b" text-anchor="start">Charade uses 15 equal-mass bins; this teaching example uses two.</text>
</g></svg>
